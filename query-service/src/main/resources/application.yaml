spring:
  application:
    name: ${QUERY_NAME:query-service}
  r2dbc:
    # Read-реплика, не primary — реестр устройств и история маршрута, эти запросы не мешают
    # записи telemetry-processor в primary.
    url: r2dbc:postgresql://${DB_REPLICA_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:telemetry}?sslMode=${DB_SSL_MODE:disable}
    username: ${DB_USER:telemetry}
    password: ${DB_PASSWORD:telemetry}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

server:
  port: ${QUERY_PORT:8082}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
  db:
    # Primary — только для регистрации устройства (DeviceAdminService/PrimaryDb), единственная
    # write-операция в сервисе; всё остальное читает с DB_REPLICA_HOST выше.
    primary:
      host: ${DB_HOST:localhost}
      port: ${DB_PORT:5432}
      name: ${DB_NAME:telemetry}
      user: ${DB_USER:telemetry}
      password: ${DB_PASSWORD:telemetry}
      ssl-mode: ${DB_SSL_MODE:disable}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true   # без этого Micrometer не экспортирует _bucket-серии для histogram_quantile()

logging:
  level:
    root: info
