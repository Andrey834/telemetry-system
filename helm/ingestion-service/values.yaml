replicaCount: 2

# Реальные image.repository / env.kafka* / credentialsSecretName задаются per-cloud в
# ArgoCD Application (см. argocd/timeweb/ и argocd/yandex/) через spec.source.helm.valuesObject —
# здесь только generic-дефолты для локального helm template/lint.
image:
  repository: telemetry/ingestion-service
  tag: "0.0.1"
  pullPolicy: Always

imagePullSecrets:
  - name: registry-credentials

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

env:
  kafkaBootstrapServers: "kafka:9092"
  kafkaSecurityProtocol: "PLAINTEXT"
  kafkaUsername: ""
  telemetryTopic: "telemetry.raw"
  ingestionPort: "8080"
  dbReplicaHost: "postgres-replica"
  dbPort: "5432"
  dbName: "telemetry"
  dbUser: "telemetry"
  dbSslMode: "disable"

# KAFKA_PASSWORD/DB_PASSWORD — управляются Terraform'ом (terraform/platform/argocd_apps.tf),
# не хранятся в git.
credentialsSecretName: ingestion-service-credentials

ingress:
  enabled: false          # включите при первом деплое после того, как ingress-nginx и cert-manager подняты
  className: nginx
  host: ingestion.telemetry.example.com   # замените на реальный домен, указывающий на IP ingress-nginx LoadBalancer
  clusterIssuer: letsencrypt-staging      # переключите на letsencrypt-prod после проверки на staging
  tlsSecretName: ingestion-service-tls

probes:
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 6
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 20
    periodSeconds: 5
    failureThreshold: 6
