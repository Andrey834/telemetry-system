apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ingestion-service.fullname" . }}-config
  labels:
    {{- include "ingestion-service.labels" . | nindent 4 }}
data:
  KAFKA_BOOTSTRAP_SERVERS: {{ .Values.env.kafkaBootstrapServers | quote }}
  KAFKA_SECURITY_PROTOCOL: {{ .Values.env.kafkaSecurityProtocol | quote }}
  KAFKA_USERNAME: {{ .Values.env.kafkaUsername | quote }}
  TELEMETRY_TOPIC: {{ .Values.env.telemetryTopic | quote }}
  INGESTION_PORT: {{ .Values.env.ingestionPort | quote }}
  DB_REPLICA_HOST: {{ .Values.env.dbReplicaHost | quote }}
  DB_PORT: {{ .Values.env.dbPort | quote }}
  DB_NAME: {{ .Values.env.dbName | quote }}
  DB_USER: {{ .Values.env.dbUser | quote }}
  DB_SSL_MODE: {{ .Values.env.dbSslMode | quote }}
