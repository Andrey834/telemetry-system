apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "ingestion-service.fullname" . }}
  labels:
    {{- include "ingestion-service.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "ingestion-service.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
