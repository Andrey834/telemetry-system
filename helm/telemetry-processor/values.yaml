replicaCount: 2

# Реальные image.repository / env.* / credentialsSecretName задаются per-cloud в
# ArgoCD Application (см. argocd/timeweb/ и argocd/yandex/) через spec.source.helm.valuesObject —
# здесь только generic-дефолты для локального helm template/lint.
image:
  repository: telemetry/telemetry-processor
  tag: "0.0.1"
  pullPolicy: Always

imagePullSecrets:
  - name: registry-credentials

service:
  type: ClusterIP
  port: 80
  targetPort: 8081

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

env:
  kafkaBootstrapServers: "kafka:9092"
  kafkaSecurityProtocol: "PLAINTEXT"
  kafkaUsername: ""
  telemetryTopic: "telemetry.raw"
  telemetryConsumerGroup: "telemetry-processor"
  redisHost: "redis"
  redisPort: "6379"
  dbHost: "postgres"
  dbPort: "5432"
  dbName: "telemetry"
  dbUser: "telemetry"
  dbSslMode: "disable"
  dbSslEnabled: "false"
  processorPort: "8081"

# DB_PASSWORD/REDIS_PASSWORD/KAFKA_PASSWORD — создаются вручную в кластере, не хранятся в git:
#   kubectl -n telemetry-system create secret generic telemetry-processor-credentials \
#     --from-literal=DB_PASSWORD='...' --from-literal=REDIS_PASSWORD='...' --from-literal=KAFKA_PASSWORD='...'
credentialsSecretName: telemetry-processor-credentials

probes:
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 15
    periodSeconds: 10
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 10
    periodSeconds: 5
