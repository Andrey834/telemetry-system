replicaCount: 2

image:
  repository: 3829bdb3-inventive-amalthea.registry.twcstorage.ru/telemetry-processor
  tag: "0.0.1"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: registry-credentials

service:
  type: ClusterIP
  port: 80
  targetPort: 8081

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

env:
  kafkaBootstrapServers: "192.168.0.8:9092"
  kafkaSecurityProtocol: "SASL_PLAINTEXT"
  kafkaUsername: "telemetry"
  telemetryTopic: "telemetry.raw"
  telemetryConsumerGroup: "telemetry-processor"
  redisHost: "192.168.0.9"
  redisPort: "6379"
  dbHost: "192.168.0.10"
  dbPort: "5432"
  dbName: "telemetry"
  dbUser: "telemetry"
  processorPort: "8081"

# DB_PASSWORD/REDIS_PASSWORD/KAFKA_PASSWORD — создаются вручную в кластере, не хранятся в git:
#   kubectl -n telemetry-system create secret generic telemetry-processor-credentials \
#     --from-literal=DB_PASSWORD='...' --from-literal=REDIS_PASSWORD='...' --from-literal=KAFKA_PASSWORD='...'
credentialsSecretName: telemetry-processor-credentials

probes:
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 15
    periodSeconds: 10
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 10
    periodSeconds: 5
