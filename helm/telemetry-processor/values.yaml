replicaCount: 2

image:
  repository: 3829bdb3-inventive-amalthea.registry.twcstorage.ru/telemetry-processor
  tag: "0.0.1"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: registry-credentials

service:
  type: ClusterIP
  port: 80
  targetPort: 8081

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

env:
  kafkaBootstrapServers: "kafka:9092"
  telemetryTopic: "telemetry.raw"
  telemetryConsumerGroup: "telemetry-processor"
  redisHost: "redis"
  redisPort: "6379"
  dbHost: "postgres"
  dbPort: "5432"
  dbName: "telemetry"
  dbUser: "telemetry"
  processorPort: "8081"

# Пароль БД намеренно не в values.yaml/ConfigMap — берётся из Secret отдельным ключом
# (см. templates/secret.yaml), а не хранится в открытом виде в git.
dbPassword: "telemetry"

probes:
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 15
    periodSeconds: 10
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 10
    periodSeconds: 5
