# Тот же принцип, что и у остальных сервисов: дашборд лежит рядом с чартом и подхватывается
# Grafana sidecar по лейблу grafana_dashboard: "1", без ручного импорта.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "query-service.fullname" . }}-dashboard
  labels:
    {{- include "query-service.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  query-service.json: |
{{ .Files.Get "dashboards/query-service-dashboard.json" | indent 4 }}
