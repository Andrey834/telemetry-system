replicaCount: 2

# Реальные image.repository / env.* / credentialsSecretName задаются per-cloud в
# ArgoCD Application (см. argocd/timeweb/ и argocd/yandex/) через spec.source.helm.valuesObject —
# здесь только generic-дефолты для локального helm template/lint.
image:
  repository: telemetry/query-service
  tag: "0.0.1"
  pullPolicy: Always

imagePullSecrets:
  - name: registry-credentials

service:
  type: ClusterIP
  port: 80
  targetPort: 8082

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

env:
  redisHost: "redis"
  redisPort: "6379"
  queryPort: "8082"
  # Домен дашборда (Angular), которому разрешён CORS-доступ к этому API — замените на реальный
  # после первого деплоя dashboard (см. helm/dashboard/values.yaml ingress.host).
  corsAllowedOrigins: "https://dashboard.telemetry.example.com"

# REDIS_PASSWORD — создаётся вручную в кластере, не хранится в git:
#   kubectl -n telemetry-system create secret generic query-service-credentials \
#     --from-literal=REDIS_PASSWORD='...'
credentialsSecretName: query-service-credentials

ingress:
  enabled: false          # включите при первом деплое после того, как ingress-nginx и cert-manager подняты
  className: nginx
  host: query.telemetry.example.com   # замените на реальный домен, указывающий на IP ingress-nginx LoadBalancer
  clusterIssuer: letsencrypt-staging  # переключите на letsencrypt-prod после проверки на staging
  tlsSecretName: query-service-tls

probes:
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 15
    periodSeconds: 10
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 10
    periodSeconds: 5
