# Применяется вручную один раз после того, как ArgoCD поднят (Terraform → модуль platform):
#   kubectl apply -f argocd/application.yaml
#
# Дальше ArgoCD сам следит за git-репозиторием: любой коммит в helm/ingestion-service
# (новая версия values.yaml, новый образ через image.tag) автоматически синхронизируется
# в кластер — это и есть GitOps: деплой триггерится пушем в git, а не ручным helm upgrade.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingestion-service
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Andrey834/telemetry-system.git   # заменить на реальный URL после первого push
    targetRevision: main
    path: helm/ingestion-service

  destination:
    server: https://kubernetes.default.svc
    namespace: telemetry-system

  syncPolicy:
    automated:
      prune: true       # удалять ресурсы, убранные из git
      selfHeal: true     # откатывать ручные изменения kubectl edit обратно к состоянию в git
    syncOptions:
      - CreateNamespace=true
