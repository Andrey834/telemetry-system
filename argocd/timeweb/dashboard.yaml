# Применяется на ArgoCD, установленной в кластере Timeweb Cloud:
#   kubectl apply -f argocd/timeweb/dashboard.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dashboard
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Andrey834/telemetry-system.git
    targetRevision: main
    path: helm/dashboard
    helm:
      valuesObject:
        image:
          repository: 3829bdb3-inventive-amalthea.registry.twcstorage.ru/dashboard

  destination:
    server: https://kubernetes.default.svc
    namespace: telemetry-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
