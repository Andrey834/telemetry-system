# Применяется на ArgoCD, установленной в кластере Timeweb Cloud:
#   kubectl apply -f argocd/timeweb/ingestion-service.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingestion-service
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Andrey834/telemetry-system.git
    targetRevision: main
    path: helm/ingestion-service
    helm:
      valuesObject:
        image:
          repository: 3829bdb3-inventive-amalthea.registry.twcstorage.ru/ingestion-service
        env:
          kafkaBootstrapServers: "192.168.0.8:9092"
          kafkaSecurityProtocol: "SASL_PLAINTEXT"
          kafkaUsername: "telemetry"
        credentialsSecretName: ingestion-service-credentials

  destination:
    server: https://kubernetes.default.svc
    namespace: telemetry-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
