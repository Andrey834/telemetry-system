# Применяется на ArgoCD, установленной в кластере Yandex Cloud:
#   kubectl apply -f argocd/yandex/dashboard.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dashboard
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Andrey834/telemetry-system.git
    targetRevision: main
    path: helm/dashboard
    helm:
      valuesObject:
        image:
          repository: cr.yandex/crp9isuggbupe94f02pg/dashboard
        imagePullSecrets: []

  destination:
    server: https://kubernetes.default.svc
    namespace: telemetry-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
