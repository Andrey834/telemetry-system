spring:
  application:
    name: ${PROCESSOR_NAME:telemetry-processor}
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:telemetry}?sslMode=${DB_SSL_MODE:disable}
    username: ${DB_USER:telemetry}
    password: ${DB_PASSWORD:telemetry}
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:telemetry}?ssl=${DB_SSL_ENABLED:false}&sslmode=${DB_SSL_MODE:disable}
    user: ${DB_USER:telemetry}
    password: ${DB_PASSWORD:telemetry}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security:
        protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl:
        username: ${KAFKA_USERNAME:}
        password: ${KAFKA_PASSWORD:}
      ssl:
        truststore:
          certificates: ${KAFKA_SSL_CA_CERT:}

server:
  port: ${PROCESSOR_PORT:8081}

app:
  telemetry:
    topic: ${TELEMETRY_TOPIC:telemetry.raw}
    consumer-group: ${TELEMETRY_CONSUMER_GROUP:telemetry-processor}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: info
