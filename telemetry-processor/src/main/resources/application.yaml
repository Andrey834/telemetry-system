spring:
  application:
    name: ${PROCESSOR_NAME:telemetry-processor}
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:telemetry}
    username: ${DB_USER:telemetry}
    password: ${DB_PASSWORD:telemetry}
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:telemetry}
    user: ${DB_USER:telemetry}
    password: ${DB_PASSWORD:telemetry}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: ${PROCESSOR_PORT:8081}

app:
  telemetry:
    topic: ${TELEMETRY_TOPIC:telemetry.raw}
    consumer-group: ${TELEMETRY_CONSUMER_GROUP:telemetry-processor}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: info
