server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA без роутинга — фактически всегда отдаём index.html, но try_files оставлен
    # на случай, если позже добавится Angular Router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # env.js генерируется entrypoint-скриптом при каждом старте контейнера — не кэшируем.
    location = /env.js {
        add_header Cache-Control "no-store";
    }
}
