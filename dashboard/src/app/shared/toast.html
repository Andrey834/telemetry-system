@for (message of visible(); track message.id) {
  <div
    class="pointer-events-auto flex items-center gap-3 rounded-lg bg-gray-800 border border-gray-700
           px-4 py-2.5 text-sm text-gray-100 shadow-lg"
  >
    <span class="h-2 w-2 flex-shrink-0 rounded-full bg-gray-500"></span>
    <span>{{ message.text }}</span>
    <button
      type="button"
      class="ml-2 text-gray-500 hover:text-gray-300"
      (click)="dismiss(message.id)"
      aria-label="Закрыть"
    >
      ✕
    </button>
  </div>
}
