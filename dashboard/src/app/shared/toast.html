@for (message of visible(); track message.id) {
  <div
    class="glass-2 pointer-events-auto flex w-64 items-start gap-2.5 rounded-panel border-l-[3px] px-3 py-2.5 text-sm {{ message.type === 'ok' ? 'border-l-ok' : 'border-l-bad' }}"
  >
    <span class="mt-1.5 h-2 w-2 flex-shrink-0 rounded-full {{ message.type === 'ok' ? 'bg-ok' : 'bg-bad' }}"></span>
    <span class="flex-1">{{ message.text }}</span>
    <button
      type="button"
      class="text-fg-faint hover:text-fg-muted"
      (click)="dismiss(message.id)"
      aria-label="Закрыть"
    >
      ✕
    </button>
  </div>
}
