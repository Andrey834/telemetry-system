<form
  class="flex w-72 flex-col gap-4 rounded-lg bg-white dark:bg-gray-800 p-8 text-gray-900 dark:text-gray-200 shadow-lg dark:shadow-none"
  (ngSubmit)="submit()"
>
  <h1 class="text-center text-lg font-semibold">telemetry-system</h1>

  <label class="flex flex-col gap-1.5 text-sm">
    Логин
    <input
      type="text"
      name="username"
      class="rounded border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-200 px-2 py-2"
      [(ngModel)]="username"
      autocomplete="username"
      required
    />
  </label>

  <label class="flex flex-col gap-1.5 text-sm">
    Пароль
    <input
      type="password"
      name="password"
      class="rounded border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-200 px-2 py-2"
      [(ngModel)]="password"
      autocomplete="current-password"
      required
    />
  </label>

  @if (error()) {
    <div class="text-sm text-red-600 dark:text-red-400">{{ error() }}</div>
  }

  <button
    type="submit"
    class="mt-2 rounded bg-blue-600 py-2.5 text-white disabled:opacity-60"
    [disabled]="loading()"
  >
    {{ loading() ? 'Вход…' : 'Войти' }}
  </button>
</form>
