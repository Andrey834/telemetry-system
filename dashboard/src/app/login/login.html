<form class="glass flex w-full max-w-[280px] flex-col gap-3 rounded-panel p-5" (ngSubmit)="submit()">
  <div class="flex items-center gap-2">
    <span class="flex h-[26px] w-[26px] flex-none items-center justify-center rounded-ctl border border-accent/45 bg-accent-soft text-xs text-accent">◎</span>
    <span class="text-base font-medium">Telemetry System</span>
  </div>
  <p class="text-xs text-fg-faint">Вход для операторов</p>

  <label class="flex flex-col gap-1 text-xs text-fg-faint">
    Логин
    <input
      type="text"
      name="username"
      class="h-9 rounded-ctl border border-line bg-surface-2 px-2.5 text-sm text-fg"
      [(ngModel)]="username"
      autocomplete="username"
      required
    />
  </label>

  <label class="flex flex-col gap-1 text-xs text-fg-faint">
    Пароль
    <input
      type="password"
      name="password"
      class="h-9 rounded-ctl border border-line bg-surface-2 px-2.5 text-sm text-fg"
      [(ngModel)]="password"
      autocomplete="current-password"
      required
    />
  </label>

  @if (error()) {
    <div class="flex items-start gap-1.5 rounded-ctl border border-bad/35 bg-bad/10 px-2.5 py-2 text-xs text-bad">
      <span>⚠</span><span>{{ error() }}</span>
    </div>
  }

  <button
    type="submit"
    class="mt-1 h-9 rounded-ctl border border-accent/55 bg-accent-soft text-sm font-medium text-fg disabled:opacity-60"
    [disabled]="loading()"
  >
    {{ loading() ? 'Вход…' : 'Войти' }}
  </button>
</form>
